  availability: 'Tiene espacio cuando preguntan: {availability}%.'
  newcomer: 'Mostrado en un espacio de audición para recién llegados — siempre señalado, nunca el primer lugar.'
  score: 'Puntaje combinado: {score} de 100.'
  no_seller: 'Ese negocio no está en Sycamore.'
  back: 'Volver al negocio'

