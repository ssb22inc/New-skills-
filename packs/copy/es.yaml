# Base Spanish copy catalogue (do, mx). Same keys as en.yaml — the
# localization engine's completeness test fails the build if a language
# catalogue is missing any key the base catalogue defines.

shoebox:
  header: 'Tu dinero de {month}, claro y sencillo:'
  sold: 'Vendiste {sales}.'
  refunds: 'Las devoluciones sumaron {refunds}.'
  fees: 'Las comisiones fueron {fees}.'
  paid_out: 'Se te pagaron {payouts}.'
  tax_over: >-
    Aviso: tus ventas de los últimos 12 meses ({rolling}) pasaron el umbral de
    registro de impuestos. Habla con tu contador.
  tax_approaching: >-
    Aviso: tus ventas de los últimos 12 meses ({rolling}) se acercan al umbral de
    registro de impuestos. Todavía no debes nada — pero ya viene.
  tax_nothing: 'Impuestos: nada que hacer este mes.'
  disclaimer: 'Estos son tus registros, no asesoría fiscal — llévalos a tu contador.'
  pdf_title: 'Paquete de registros Sycamore — {month}'
  pdf_sales: 'Ventas: {sales}'
  pdf_refunds: 'Devoluciones: {refunds}'
  pdf_fees: 'Comisiones: {fees}'
  pdf_paid_out: 'Pagado: {payouts}'

settlement:
  payout: '{amount} van en camino hacia ti hoy.'

hurricane:
  freeze: 'Viene tormenta — las reservas están en pausa mientras cuidamos a quienes ya reservaron. Cuídate.'
  were_safe: 'Salimos bien. Toda reserva fue movida o devuelta — revisa tu chat.'
  were_open: 'Estamos ABIERTOS otra vez. Los vendedores ya están tomando reservas.'

lifeline:
  blackout_broadcast: 'Modo tormenta — tu dinero está seguro y retenido hasta que esto pase.'
  media_stripped: '(Las fotos y notas de voz no te llegan ahora — escríbeme mejor.)'

pulse:
  kill: >-
    Paramos un anuncio que gastó {spend} y casi nadie lo tocó. Ese dinero pasa a
    tus anuncios que sí funcionan.
  refresh: >-
    Mucha gente ya vio este anuncio y los toques bajan, así que refrescamos la
    imagen y las palabras. Misma oferta, nueva energía.
  scale: >-
    Tu anuncio va bien — buenos toques por el dinero. Le pusimos {allocated} hoy
    (tu tope: {cap}).
  hold: 'Dejamos {allocated} en este anuncio mientras encuentra su público.'
  cross_pollinate: >-
    El estilo que funciona en tu mejor anuncio ahora se prueba en {vertical}
    también, con palabras escritas para ese público.

mentor:
  photo_freshness: >-
    Tus fotos del menú ya están viejas — mándame una foto nueva y yo refresco
    todo.
  repeat_rate: '{repeaters} de tus {buyers} clientes volvieron — los clientes fieles son tu motor.'

chairman:
  memo_header: 'Memo semanal — lo que aguantó las pruebas:'
  probes_header: 'Pruebas pequeñas que valen la pena:'

install:
  offer_fallback: >-
    Tu negocio está creciendo. Pon Sycamore en tu pantalla de inicio — abre más
    rápido y sigue funcionando cuando se cae el internet. {link}

trust_page:
  verified_badge: 'Verificado por Sycamore'
  early_days: 'Recién empezando — {orders} pedidos completados'
  guarantee_back_on_time: 'Garantía de regreso a tiempo: si vuelves tarde, te devolvemos el dinero.'
  next_openings: 'Próximas fechas'
  no_openings: 'Escríbenos para las próximas fechas.'
  open_units: '{units} disponibles'
  cta: 'Escríbenos por WhatsApp'
  why_ranked: '¿Por qué veo a este vendedor?'
  licences: 'Licencias'
