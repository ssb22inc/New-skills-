# Publishes Fullburn's PRIVATE PREVIEW to the existing `fullburn-engine` Worker
# on the account's free workers.dev address. CLASS 2.
#
# Manual only (workflow_dispatch), from main only, with the `fullburn` GitHub
# environment's keys and nothing else (no other project's secrets). It runs
# MAIN's OWN CODE. It makes no AI call and buys nothing: it uploads one static
# Worker script on the Workers plan already paid for.
#
# The page is private or it is not published: the preview decisions module
# refuses to deploy unless Cloudflare Access is configured (ACCESS_TEAM_DOMAIN
# and ACCESS_AUD, environment VARIABLES) or PREVIEW_PASSWORD (an environment
# SECRET, 12+ characters) is set, and after upload it fails the run if an
# anonymous visitor gets the page.
name: fullburn-preview

on:
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: fullburn
    steps:
      - name: Refuse to run from anywhere but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "the preview publishes only from main; dispatched from ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install
        working-directory: fullburn
        run: npm ci
      - name: Verify the signature of the live report the page will show
        id: verify
        working-directory: fullburn
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL=$(node engine/scripts/preview-deploy.mjs --plan)
          if [ -z "$REL" ]; then echo "no live report to show"; exit 0; fi
          if gh attestation verify "$REL" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/fullburn-live.yml" --source-ref refs/heads/main; then
            echo "verified=$REL" >> "$GITHUB_OUTPUT"
          else
            echo "the live report's signature did not verify — the page will say so"
          fi
      - name: Publish (the fullburn environment's Cloudflare token)
        working-directory: fullburn
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          VERIFIED: ${{ steps.verify.outputs.verified }}
        run: |
          if [ -n "$VERIFIED" ]; then
            node engine/scripts/preview-deploy.mjs --verified "$VERIFIED"
          else
            node engine/scripts/preview-deploy.mjs
          fi
