# The cross-family read (DONE.md §2.1.3; ENGINE_BUILD §2.4). CLASS 2 — changing
# this workflow requires an APPROVALS entry (class2-gate).
#
# Human ruling 2026-09-22: the non-Claude review runs IN CI, router-bound, on
# GPT Astra through OpenRouter, so it is never a by-hand claim. It is
# dispatched, not triggered on push: one read costs real money (the whole
# verified tree, ~330k tokens, at the reviewer's price) and reviews a tree the
# human chose. The job FAILS CLOSED without the secret — the runner exits 2
# saying NOT CONFIGURED and writes nothing — and a report from any endpoint but
# the production router can never carry Verdict: PASS (cross-family-lib).
#
# PROVENANCE BY SIGNATURE (cross-family finding X5-02, 2026-10-06). With the
# human gate on review artifacts removed, a handwritten PASS could open the
# adversary gate. Now this workflow ATTESTS the new report's exact bytes with
# GitHub's artifact attestation (Sigstore, keyless, bound to this workflow
# file), and the adversary gate opens only on a PASS whose bytes carry that
# attestation. The workflow then commits the attested report to the branch it
# was dispatched on — the commit's author is irrelevant; the signature is the
# evidence. It is also uploaded as an artifact.
name: cross-family-read

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  cross-family-read:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fullburn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - name: Cross-family read (pinned reviewer; fails closed without the secret)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run cross-family-read
      - name: Report to the job summary
        if: always()
        run: |
          for f in reports/ADVERSARY_REPORT_phase*.x*.md; do
            [ -f "$f" ] || continue
            { echo "## $f"; echo; echo '```'; sha256sum "$f"; echo '```'; echo; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Name the new report
        id: new
        if: success()
        run: |
          NEW=$(git ls-files --others --exclude-standard reports/ | grep -E '^reports/ADVERSARY_REPORT_phase[^/]*\.x[0-9]+\.md$' | head -1)
          [ -n "$NEW" ] || { echo "no new report was written"; exit 1; }
          echo "report=fullburn/$NEW" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: success()
        with:
          subject-path: ${{ steps.new.outputs.report }}
      - name: Commit the attested report to the dispatched branch
        if: success()
        env:
          REPORT: ${{ steps.new.outputs.report }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "../$REPORT" "../${REPORT%.md}.raw.json"
          git commit -m "Record attested cross-family read: ${REPORT##*/}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cross-family-read
          path: |
            fullburn/reports/ADVERSARY_REPORT_phase*.x*.md
            fullburn/reports/ADVERSARY_REPORT_phase*.x*.raw.json
            fullburn/reports/cross-family-*-rejected-*.raw.json
          if-no-files-found: ignore
