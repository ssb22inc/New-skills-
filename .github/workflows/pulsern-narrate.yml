name: pulsern-narrate

# Records explainer narration with OpenAI TTS and checks every clip by
# transcribing it back (pulsern/ops/narrate.mjs). Manual only: it spends money.
#
# Needs repository secrets: OPENAI_API_KEY (owner adds it; never rotated by
# this job), SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (for the public
# `explainers` audio bucket).
#
# The manifest (src/diagrams/narration.json) and the run report are
# committed back to the branch, so new audio reaches students only through
# a reviewed pull request. Saved even when some clips fail: every paid
# recording is kept, and clips that fail the audio check are listed.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run on and commit the manifest to (never main)"
        required: true
      voice:
        description: "OpenAI voice (marin, cedar, alloy, ash, ballad, coral, echo, fable, nova, onyx, sage, shimmer, verse)"
        required: true
        default: "marin"

permissions:
  contents: write
  actions: write        # request the trusted Astra review of what this job pushes
  pull-requests: read   # find the branch's open PR

concurrency:
  group: pulsern-narrate-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch }}
      VOICE: ${{ inputs.voice }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pulsern
    steps:
      # Only a plain feature-branch name is accepted, and never the default
      # branch: "refs/heads/main", tags, SHAs and other aliases are refused
      # outright, so checkout, push, concurrency and PR lookup all see the
      # same exact branch (Astra, PR #134 review, round 6).
      - name: Refuse to write to main
        working-directory: .
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1 Run on a feature branch; the manifest is committed to it."; exit 1; }
          [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || fail "'$BRANCH' is not a plain branch name."
          case "$BRANCH" in refs/*|*/|*..*|*.lock|HEAD) fail "'$BRANCH' is not a plain branch name." ;; esac
          git check-ref-format --branch "$BRANCH" >/dev/null 2>&1 || fail "'$BRANCH' is not a valid branch name."
          for protected in "$DEFAULT_BRANCH" main master; do
            [ "$BRANCH" = "$protected" ] && fail "'$BRANCH' is protected."
          done
          [[ "$BRANCH" =~ ^[0-9a-f]{7,40}$ ]] && fail "'$BRANCH' looks like a commit, not a branch."
          # It must be an existing branch of this repository — not a tag or commit.
          curl -fsS -o /dev/null -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/branches/$(jq -rn --arg b "$BRANCH" '$b|@uri')" || fail "'$BRANCH' is not an existing branch."
          echo "Writing to feature branch '$BRANCH'."

      - name: Check the voice name
        working-directory: .
        run: |
          case "$VOICE" in
            marin|cedar|alloy|ash|ballad|coral|echo|fable|nova|onyx|sage|shimmer|verse) ;;
            *) echo "::error::Unknown voice: $VOICE"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulsern/package-lock.json

      - run: npm ci

      - name: Record and check narration
        id: narrate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          node ops/narrate.mjs --voice "$VOICE"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show the run report
        if: always()
        run: cat reports/narration/run-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # Kept whatever happens to the push below: a conflicting concurrent
      # update to the branch must not cost a paid run its results.
      - name: Keep the results as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsern-narration-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pulsern/src/diagrams/narration.json
            pulsern/reports/narration/
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit the manifest to the branch (always)
        id: save
        if: always()
        run: |
          git config user.name "pulsern-narrate"
          git config user.email "pulsern-narrate@users.noreply.github.com"
          # Commit, push, and confirm the commit reached the branch; a conflict
          # fails instead of reporting a save (Astra, PR #134 review, round 7).
          ops/save-results.sh "$BRANCH" "Narration: $VOICE (rc=${{ steps.narrate.outputs.rc }})" src/diagrams/narration.json reports/narration/

      # Pushes made with the workflow token do not trigger other workflows, so
      # the review this commit needs is requested explicitly — through the
      # trusted, range-verified dispatch (Astra, PR #133 review, finding 17).
      - name: Request CI and the Astra review of what was just pushed
        if: always() && steps.save.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ steps.save.outputs.head }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          # CI on the commit actually pushed — after any rebase — so the
          # publication guards (fresh map, current manifest, tests) run on the
          # final tree, not on the one the job started from (Astra, PR #134
          # review, round 5).
          jq -n --arg ref "$BRANCH" '{ref:$ref}' |
            api -X POST "https://api.github.com/repos/$REPO/actions/workflows/pulsern-ci.yml/dispatches" -d @- >/dev/null
          echo "Started pulsern-ci on $BRANCH ($HEAD_SHA)."
          pr=$(api "https://api.github.com/repos/$REPO/pulls?state=open&head=$OWNER:$BRANCH" | jq -r '.[0].number // empty')
          if [ -z "$pr" ]; then echo "No open PR for $BRANCH: its review will run when one is opened."; exit 0; fi
          jq -n --arg ref "$DEFAULT_BRANCH" --arg head "$HEAD_SHA" --arg pr "$pr" '{ref:$ref,inputs:{head:$head,pr:$pr}}' |
            api -X POST "https://api.github.com/repos/$REPO/actions/workflows/pulsern-astra-review.yml/dispatches" -d @- >/dev/null
          echo "Requested the Astra review of PR #$pr at $HEAD_SHA."
      - name: Verdict
        if: always()
        run: |
          [ "${{ steps.narrate.outputs.rc }}" = "0" ] || { echo "::error::Some clips failed the audio check or errored — see the report."; exit 1; }
