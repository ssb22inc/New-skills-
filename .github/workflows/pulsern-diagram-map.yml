name: pulsern-diagram-map

# Pairs concept diagrams with practice questions, each pairing confirmed by
# GPT Astra (pulsern/ops/map-diagrams.mjs). Manual only: it spends money.
#
# Writes the confirmed map (src/diagrams/item-map.json), the decision cache
# and a run report back to the branch it ran on, so the result arrives as an
# ordinary commit on a pull request and goes through the Astra code review
# like anything else. Saved even when the run stops early: every paid
# decision is kept.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run on and commit the results to (never main)"
        required: true
      max_usd:
        description: "Spend cap for this run, in USD"
        required: true
        default: "15"
      limit:
        description: "Optional: stop after this many decisions (a pilot run)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write        # request the trusted Astra review of what this job pushes
  pull-requests: read   # find the branch's open PR

concurrency:
  group: pulsern-diagram-map-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch }}
      MAX_USD: ${{ inputs.max_usd }}
      LIMIT: ${{ inputs.limit }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pulsern
    steps:
      - name: Refuse to write to main
        working-directory: .
        run: |
          case "$BRANCH" in
            main|master) echo "::error::Results are committed to the branch given; run on a feature branch."; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulsern/package-lock.json

      - run: npm ci

      - name: Pair diagrams with questions (Astra-confirmed)
        id: map
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          [[ "$MAX_USD" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::max_usd must be a number"; exit 1; }
          [[ -z "$LIMIT" || "$LIMIT" =~ ^[0-9]+$ ]] || { echo "::error::limit must be a whole number"; exit 1; }
          node ops/map-diagrams.mjs --max-usd "$MAX_USD" ${LIMIT:+--limit "$LIMIT"}
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show the run report
        if: always()
        run: cat reports/diagram-map/run-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Commit results to the branch (always — every paid decision is kept)
        id: save
        if: always()
        run: |
          git config user.name "pulsern-diagram-map"
          git config user.email "pulsern-diagram-map@users.noreply.github.com"
          # A run that failed early may not have written every path; add what exists.
          for p in src/diagrams/item-map.json reports/diagram-map/; do [ -e "$p" ] && git add -- "$p"; done
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -q -m "Diagram pairings: Astra-confirmed run (rc=${{ steps.map.outputs.rc }})"
          for attempt in 1 2 3; do
            git push -q origin "HEAD:$BRANCH" && { echo "Saved."; echo "pushed=true" >> "$GITHUB_OUTPUT"; echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; }
            git pull -q --rebase origin "$BRANCH" || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the results."; exit 1

      # Pushes made with the workflow token do not trigger other workflows, so
      # the review this commit needs is requested explicitly — through the
      # trusted, range-verified dispatch (Astra, PR #133 review, finding 17).
      - name: Request the Astra review of what was just pushed
        if: always() && steps.save.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ steps.save.outputs.head }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          pr=$(api "https://api.github.com/repos/$REPO/pulls?state=open&head=$OWNER:$BRANCH" | jq -r '.[0].number // empty')
          if [ -z "$pr" ]; then echo "No open PR for $BRANCH: its review will run when one is opened."; exit 0; fi
          jq -n --arg ref "$DEFAULT_BRANCH" --arg head "$HEAD_SHA" --arg pr "$pr" '{ref:$ref,inputs:{head:$head,pr:$pr}}' |
            api -X POST "https://api.github.com/repos/$REPO/actions/workflows/pulsern-astra-review.yml/dispatches" -d @- >/dev/null
          echo "Requested the Astra review of PR #$pr at $HEAD_SHA."
      - name: Verdict
        if: always()
        run: |
          [ "${{ steps.map.outputs.rc }}" = "0" ] || { echo "::error::The pairing run did not complete cleanly — see the report."; exit 1; }
