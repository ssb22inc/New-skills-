name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sycamore
          POSTGRES_PASSWORD: sycamore
          POSTGRES_DB: sycamore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sycamore -d sycamore"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://sycamore:sycamore@localhost:5432/sycamore
      REDIS_URL: redis://localhost:6379
      # A Postgres that fails to start must FAIL the build, not skip
      # every money gate and go green (tests/src/ci/database-required).
      SYCAMORE_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # P31 core-diff gate diffs against the JM-only baseline commit
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test
      # The trust-page budget (<100KB, interactive <2s on throttled 3G)
      # is a product law, so it is a build step — not a script somebody
      # remembers to run.
      - run: pnpm --filter @sycamore/web build
      - run: pnpm --filter @sycamore/tests perf:trust
      # Load profiles run against the real gateway on every push; k6 is
      # the heavy weekly profile, this is the always-on floor.
      - run: pnpm --filter @sycamore/tests load:smoke
