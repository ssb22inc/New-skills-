# The deployed origin, checked on a schedule (BUILD §5.3 — nightly paths
# against a live environment, not just against localhost).
#
# This is deliberately NOT part of `ci`. The main pipeline must stay
# green or red on the commit alone; this one answers a different
# question — "is what we actually serve still installable?" — and its
# answer can change without a commit: an expired certificate, a dropped
# `public/` directory, a database that stopped answering, a host that
# started gating the origin behind a login wall. None of those are
# caught by a build, and all of them are caught by a phone.
#
# It is read-only. It loads pages and reads a manifest; it writes nothing.
name: deploy-audit

on:
  schedule:
    # 06:00 UTC — 01:00 in Jamaica, after the quiet hours and before the
    # first seller opens their day.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      origin:
        description: 'Origin to audit (defaults to the production deployment)'
        required: false
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SYCAMORE_ORIGIN: ${{ inputs.origin || 'https://sycamore-ssb22incs-projects.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The audit drives a real browser: a source string cannot prove a
      # service worker activates on the origin we actually serve.
      - run: pnpm --filter @sycamore/tests exec playwright install --with-deps chromium
      - run: pnpm --filter @sycamore/tests deploy:audit
