name: content-factory

on:
  schedule:
    - cron: "0 6,18 * * *" # twice daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsern
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pulsern/package-lock.json

      - run: npm ci

      - name: Preflight — required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Presence only — lengths and names, never values.
          missing=""
          [ -n "$SUPABASE_URL" ]             || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$OPENROUTER_API_KEY" ]        || missing="$missing OPENROUTER_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo ""
            echo "These must be REPOSITORY secrets on ssb22inc/New-skills-:"
            echo "  Settings -> Secrets and variables -> Actions -> Repository secrets"
            echo ""
            echo "Common causes: added as Variables rather than Secrets, added as"
            echo "Environment or Dependabot secrets (Actions cannot read those), or"
            echo "added to a different repository."
            exit 1
          fi
          echo "All three required secrets are present."
          echo "  SUPABASE_URL length: ${#SUPABASE_URL}"
          echo "  SUPABASE_SERVICE_ROLE_KEY length: ${#SUPABASE_SERVICE_ROLE_KEY}"
          echo "  OPENROUTER_API_KEY length: ${#OPENROUTER_API_KEY}"

      - name: Run question factory
        run: node ops/content-factory.mjs --batch 12
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run flashcard factory
        run: node ops/card-factory.mjs --batch 40
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run case factory
        run: node ops/case-factory.mjs --count 2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `content factory failed ${date}`,
              body: `The scheduled content-factory run failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck the OpenRouter/Supabase secrets and the job log, then re-run the workflow.`,
            });
