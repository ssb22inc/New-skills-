name: pulsern-astra-review

# GPT Astra reviews every PulseRN pull request.
#
# Owner's standing instructions this enforces:
#   - all AI review and adversarial action is GPT Astra's, never same-family;
#   - every paid review is kept, whatever its verdict;
#   - no cross-contamination: this job reads and judges PulseRN files only.
#
# TRUST. This runs on pull_request_target, so GitHub always uses THIS FILE AS
# IT IS ON THE BASE BRANCH — a pull request cannot edit its own review. (The
# first version used pull_request, which runs the PR's copy of the workflow;
# Astra's review of it showed a PR could then report a pass without ever
# calling Astra.) The pull request is fetched as DATA only: nothing from it is
# installed, built or executed. The reviewer and the rules it judges against
# come from the base branch.
#
# RESULT. The verdict is posted as the commit status `pulsern/astra-review` on
# the exact head commit that was reviewed. Make THAT the required check: it is
# bound to the reviewed SHA, and it is red — never skipped-green — when a
# review could not run.
#
# RECORD. Each report is committed to the `pulsern-astra-reviews` branch and
# uploaded as an artifact. A paid review is never cancelled by a newer push,
# and a checkpoint report is written before the paid call, so even a killed
# run leaves a record.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "pulsern/**"
      - ".github/workflows/pulsern-*.yml"
  # Re-review on demand. With `pr`, the range comes from GitHub's own record
  # of that PR (never from the inputs) and `head` must be its current head;
  # only then is the commit status posted. Without `pr` it is a report-only
  # review of an arbitrary range: saved like any other, but it never touches
  # a commit status, so it cannot certify anything (Astra, PR #133 review,
  # finding 1: a dispatch with base = head posted a pass without a review).
  workflow_dispatch:
    inputs:
      base: { description: "Base commit SHA (report-only runs; ignored when pr is given)", required: false }
      head: { description: "Head commit SHA to review", required: true }
      pr:   { description: "PR number — its range is read from GitHub and its status posted", required: false }

# The workflow token can NOT post statuses. The required check is posted
# only by the PulseRN Astra GitHub App, whose key lives in the `astra-review`
# environment, restricted to the default branch. A run started from any
# other branch — whose copy of this file could say anything — cannot read
# that key, so it cannot produce the status branch protection requires
# (Astra, PR #134 review, finding 1: a check written inside a dispatchable
# workflow is not a trust boundary; GitHub's environment rules are).
permissions:
  contents: write   # commit the report to the reviews branch

# Queue, never cancel: a review already being paid for always finishes and is
# saved. Only runs that have not started yet are superseded, which costs
# nothing.
concurrency:
  group: pulsern-astra-review-${{ github.event.pull_request.number || inputs.pr || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    # Unrelated labels do not trigger a paid review.
    if: github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'astra-review'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: astra-review
    env:
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OUT: ${{ github.workspace }}/astra-out
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Decides WHAT is reviewed and whether the verdict may be posted. Sets
      # HEAD_SHA, BASE_SHA, PR and POST_STATUS for every later step.
      - name: Resolve what to review
        env:
          EVENT: ${{ github.event_name }}
          EV_HEAD: ${{ github.event.pull_request.head.sha }}
          EV_BASE: ${{ github.event.pull_request.base.sha }}
          EV_PR: ${{ github.event.pull_request.number }}
          EV_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EV_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          IN_HEAD: ${{ inputs.head }}
          IN_BASE: ${{ inputs.base }}
          IN_PR: ${{ inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          sha() { [[ "$1" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$1' is not a full commit SHA"; exit 1; }; }
          # A status belongs to a commit, not to a PR or a range. Only a review
          # of the FULL change into the protected branch may post it; a PR
          # aimed at another branch would review only part of the same head
          # (Astra, PR #134 review, finding 2).
          into_default() { [ "$1" = "$DEFAULT_BRANCH" ] && [ "$2" = "$REPO" ]; }
          if [ "$EVENT" = "pull_request_target" ]; then
            post=false; into_default "$EV_BASE_REF" "$EV_BASE_REPO" && post=true
            { echo "HEAD_SHA=$EV_HEAD"; echo "BASE_SHA=$EV_BASE"; echo "PR=$EV_PR"; echo "POST_STATUS=$post"; } >> "$GITHUB_ENV"
            [ "$post" = true ] || echo "PR #$EV_PR targets $EV_BASE_REPO:$EV_BASE_REF, not $DEFAULT_BRANCH: report only, no status."
            exit 0
          fi
          # A dispatch runs the reviewer from the ref it was started on, so
          # only the default branch's reviewer is trusted.
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Start this review from $DEFAULT_BRANCH; the reviewer on $GITHUB_REF has not itself been reviewed."; exit 1
          fi
          sha "$IN_HEAD"
          if [ -n "$IN_PR" ]; then
            [[ "$IN_PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number"; exit 1; }
            pr_json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$IN_PR")
            pr_head=$(jq -r .head.sha <<<"$pr_json"); pr_base=$(jq -r .base.sha <<<"$pr_json")
            pr_base_ref=$(jq -r .base.ref <<<"$pr_json"); pr_base_repo=$(jq -r .base.repo.full_name <<<"$pr_json")
            sha "$pr_head"; sha "$pr_base"
            if [ "$IN_HEAD" != "$pr_head" ]; then
              echo "::error::head $IN_HEAD is not PR #$IN_PR's head ($pr_head). Only a PR's real head can receive its status."; exit 1
            fi
            post=false; into_default "$pr_base_ref" "$pr_base_repo" && post=true
            { echo "HEAD_SHA=$pr_head"; echo "BASE_SHA=$pr_base"; echo "PR=$IN_PR"; echo "POST_STATUS=$post"; } >> "$GITHUB_ENV"
            [ "$post" = true ] || echo "PR #$IN_PR targets $pr_base_repo:$pr_base_ref, not $DEFAULT_BRANCH: report only, no status."
          else
            sha "$IN_BASE"
            { echo "HEAD_SHA=$IN_HEAD"; echo "BASE_SHA=$IN_BASE"; echo "PR="; echo "POST_STATUS=false"; } >> "$GITHUB_ENV"
            echo "Report-only review of $IN_BASE...$IN_HEAD: no commit status will be posted."
          fi

      # The only credential that can post the required status: a short-lived
      # token for the PulseRN Astra App, minted from a key that exists only
      # in the main-only `astra-review` environment. Not configured yet →
      # the review still runs and is saved, but posts no status.
      - name: Status publisher token (PulseRN Astra App)
        if: env.POST_STATUS == 'true'
        env:
          APP_ID: ${{ vars.ASTRA_APP_ID }}
          APP_KEY: ${{ secrets.ASTRA_APP_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID:-}" ] || [ -z "${APP_KEY:-}" ]; then
            echo "::warning::The PulseRN Astra App is not configured (vars.ASTRA_APP_ID / secret ASTRA_APP_KEY in the astra-review environment). Report only: no status posted."
            echo "POST_STATUS=false" >> "$GITHUB_ENV"; exit 0
          fi
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$APP_ID" | b64url)
          key=$(mktemp); trap 'rm -f "$key"' EXIT; printf '%s' "$APP_KEY" > "$key"
          sig=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$key" | b64url)
          jwt="$header.$payload.$sig"
          inst=$(curl -fsS -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/installation" | jq -r .id)
          tok=$(jq -n --arg r "${REPO#*/}" '{repositories:[$r],permissions:{statuses:"write"}}' |
            curl -fsS -X POST -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" "https://api.github.com/app/installations/$inst/access_tokens" -d @- | jq -r .token)
          [ -n "$tok" ] && [ "$tok" != null ] || { echo "::error::Could not mint the status token"; exit 1; }
          echo "::add-mask::$tok"
          echo "STATUS_TOKEN=$tok" >> "$GITHUB_ENV"

      - name: Mark the commit under review as pending
        if: env.POST_STATUS == 'true'
        run: |
          jq -n --arg u "$RUN_URL" '{state:"pending",context:"pulsern/astra-review",description:"Astra is reviewing this commit",target_url:$u}' |
            curl -fsS -X POST -H "Authorization: Bearer $STATUS_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" -d @- >/dev/null

      # Decides whether a paid review may run. Anything that cannot be reviewed
      # ends red or pending on the commit — never a silent, green skip.
      - name: Gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'astra-review') }}
        run: |
          if [ "$EVENT" = "pull_request_target" ] && [ "$IS_DRAFT" = "true" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"; echo "state=pending" >> "$GITHUB_OUTPUT"
            echo "why=Draft: the review runs when the PR is marked ready" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request_target" ] && [ "$IS_FORK" = "true" ] && [ "$LABELED" != "true" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"; echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "why=Fork PR: a maintainer must add the astra-review label before it is reviewed" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the trusted reviewer (base branch)
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      # The change under review, as data. Fork heads are fetched from this
      # repository's refs/pull/N/head, so they arrive without running anything.
      - name: Fetch the change under review (data only, never executed)
        if: steps.gate.outputs.allowed == 'true'
        run: |
          git init -q target && cd target
          git remote add origin "https://github.com/$REPO.git"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" fetch -q origin "$BASE_SHA"
          if [ -n "$PR" ]; then
            git -c http.extraheader="$AUTH" fetch -q origin "+refs/pull/$PR/head:refs/remotes/pr/head"
            test "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA" || { echo "::error::PR head moved during the run"; exit 1; }
          else
            git -c http.extraheader="$AUTH" fetch -q origin "$HEAD_SHA"
          fi
          git cat-file -e "$HEAD_SHA^{commit}" && git cat-file -e "$BASE_SHA^{commit}"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.allowed == 'true'
        with:
          node-version: 22

      - name: Astra review
        id: review
        if: steps.gate.outputs.allowed == 'true'
        timeout-minutes: 45
        working-directory: target
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASTRA_REVIEW_MODE: trusted
        run: |
          set +e
          node "$GITHUB_WORKSPACE/trusted/pulsern/ops/astra-review.mjs" \
            --base "$BASE_SHA" --head "$HEAD_SHA" ${PR:+--pr "$PR"} --out "$OUT"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # The steps below find the report by looking for it, not by trusting the
      # review step's outputs, so a review killed mid-call is still kept.
      - name: Show the report in the run summary
        if: always() && hashFiles('astra-out/*.md') != ''
        run: cat "$OUT"/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report as an artifact
        if: always() && hashFiles('astra-out/*.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: astra-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: astra-out/
          retention-days: 90

      - name: Commit the report to the reviews branch
        if: always() && hashFiles('astra-out/*.md') != ''
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          BRANCH=pulsern-astra-reviews
          mkdir reviews && cd reviews
          git init -q
          git config user.name "pulsern-astra-review"
          git config user.email "pulsern-astra-review@users.noreply.github.com"
          git remote add origin "https://github.com/$REPO.git"
          # Success is reported ONLY when a push has actually landed.
          for attempt in 1 2 3 4 5; do
            if git -c http.extraheader="$AUTH" fetch -q --depth 1 origin "$BRANCH" 2>/dev/null; then
              git checkout -q -B "$BRANCH" FETCH_HEAD
            elif ! git rev-parse --verify -q "refs/heads/$BRANCH" >/dev/null; then
              git checkout -q --orphan "$BRANCH"
            fi
            mkdir -p reports
            cp "$OUT"/* reports/
            git add reports
            if ! git diff --cached --quiet; then
              git commit -q -m "Astra review: ${PR:+PR #$PR }@ $HEAD_SHA (rc=${{ steps.review.outputs.rc || 'none' }})"
            fi
            if git -c http.extraheader="$AUTH" push -q origin "HEAD:$BRANCH"; then
              echo "Saved to $BRANCH"
              exit 0
            fi
            echo "push did not land (likely raced with another review); retrying ($attempt/5)"
            sleep $((attempt * 3))
          done
          echo "::error::Could not save the review report after 5 attempts. It is still in the run's artifacts."
          exit 1

      # Bound to the reviewed head SHA. Runs whatever happened above — except
      # for report-only reviews, which never post a status.
      - name: Post the verdict on the reviewed commit
        if: always() && env.POST_STATUS == 'true'
        env:
          RC: ${{ steps.review.outputs.rc }}
          ALLOWED: ${{ steps.gate.outputs.allowed }}
          GATE_STATE: ${{ steps.gate.outputs.state }}
          GATE_WHY: ${{ steps.gate.outputs.why }}
        run: |
          if [ "$ALLOWED" != "true" ]; then
            STATE="${GATE_STATE:-failure}"; DESC="${GATE_WHY:-Review could not run}"
          else
            case "$RC" in
              0) STATE=success; DESC="Astra: PASS" ;;
              1) STATE=failure; DESC="Astra: FAIL — see the report" ;;
              *) STATE=failure; DESC="Astra review did not complete — recorded as a failure" ;;
            esac
          fi
          echo "$STATE: $DESC"
          jq -n --arg s "$STATE" --arg d "${DESC:0:139}" --arg u "$RUN_URL" '{state:$s,context:"pulsern/astra-review",description:$d,target_url:$u}' |
            curl -fsS -X POST -H "Authorization: Bearer $STATUS_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" -d @- >/dev/null
          [ "$STATE" = "success" ] || [ "$STATE" = "pending" ] || exit 1

      # A report-only review posts no status, so its verdict is the run's own.
      - name: Report-only verdict
        if: always() && env.POST_STATUS != 'true'
        env:
          RC: ${{ steps.review.outputs.rc }}
        run: |
          [ "$RC" = "0" ] && { echo "Astra: PASS (report only)"; exit 0; }
          echo "::error::Astra: FAIL or incomplete (rc=${RC:-none}) — see the report"; exit 1
