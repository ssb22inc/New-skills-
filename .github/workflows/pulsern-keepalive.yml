name: keepalive

# Keeps the PulseRN Supabase project awake, and raises an incident the moment
# it is not reachable.
#
# On 2026-09-28 students hit "Failed to fetch" on the sign-in screen. The
# project had been paused since roughly 2026-09-08: Supabase parks a free-tier
# project after about a week without database activity, taking the database and
# auth offline together. Nothing monitored it, so the outage was discovered by
# the owner failing to sign in.
#
# Daily is well inside the pause window and costs one tiny query. Running on a
# weekday-only or every-few-days schedule would leave less margin for a run that
# is skipped or queued.
#
# NOTE: GitHub disables scheduled workflows in a repository with no activity for
# 60 days. That would silently disarm this guard, so the run log names it as the
# first thing to check if the schedule appears to have stopped.

on:
  schedule:
    - cron: "0 11 * * *"   # ~7am ET daily, before most study sessions
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: pulsern-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsern
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulsern/package-lock.json

      - run: npm ci --omit=dev

      - name: Touch the database and the sign-in path
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node ops/keepalive.mjs

      # Same incident discipline as the content factory: one open issue per
      # outage rather than a new one per day, and it closes itself on recovery
      # so a green run is not silently indistinguishable from a fixed one.
      - name: Reconcile availability incident
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_RESULT: ${{ job.status }}
        with:
          script: |
            const marker = "<!-- pulsern-keepalive-incident -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const incidents = openIssues.filter((issue) =>
              !issue.pull_request && issue.body?.includes(marker)
            );

            if (process.env.RUN_RESULT === "success") {
              for (const issue of incidents) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `PulseRN is reachable again as of ${runUrl}. Closing this incident.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              core.info(`Reachable; closed ${incidents.length} open incident(s).`);
              return;
            }

            const body = [
              marker,
              "**PulseRN is not reachable. Students cannot sign in or study.**",
              "",
              `Failing run: ${runUrl} — the log names which surface failed and why.`,
              "",
              "The most likely cause is that the Supabase project has been paused.",
              "Supabase parks a free-tier project after about a week without database",
              "activity, which takes the database and auth offline together and shows",
              "every student \"Failed to fetch\" on the sign-in screen.",
              "",
              "**Fix:** open the project in the Supabase dashboard and restore it.",
              "It takes a few minutes to come back up.",
              "",
              "This issue closes itself on the next successful run.",
            ].join("\n");

            if (incidents.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incidents[0].number,
                body: `Still unreachable as of ${runUrl}.`,
              });
              core.setFailed("PulseRN unreachable; existing incident updated.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "PulseRN unreachable — students cannot sign in",
              body,
            });
            core.setFailed("PulseRN unreachable; incident opened.");
