name: pulsern-diagram-review

# GPT Astra reviews every concept diagram as a student sees it: rendered in
# both themes and at every explainer step, alongside every clinical claim,
# caption and narration script (pulsern/ops/review-diagrams.mjs).
#
# Manual, on a feature branch: rendering runs the branch's code, so this
# never runs automatically on someone else's pull request with secrets.
# Unchanged diagrams keep their earlier verdict. Every paid review is
# committed back to the branch, PASS or FAIL.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to review and commit the reports to (never main)"
        required: true
      only:
        description: "Optional: review one diagram id only"
        required: false
        default: ""

permissions:
  contents: write
  actions: write        # request the trusted Astra review of what this job pushes
  pull-requests: read   # find the branch's open PR

concurrency:
  group: pulsern-diagram-review-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch }}
      ONLY: ${{ inputs.only }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pulsern
    steps:
      # Only a plain feature-branch name is accepted, and never the default
      # branch: "refs/heads/main", tags, SHAs and other aliases are refused
      # outright, so checkout, push, concurrency and PR lookup all see the
      # same exact branch (Astra, PR #134 review, round 6).
      - name: Refuse to write to main
        working-directory: .
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1 Run on a feature branch; reports are committed to it."; exit 1; }
          [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || fail "'$BRANCH' is not a plain branch name."
          case "$BRANCH" in refs/*|*/|*..*|*.lock|HEAD) fail "'$BRANCH' is not a plain branch name." ;; esac
          git check-ref-format --branch "$BRANCH" >/dev/null 2>&1 || fail "'$BRANCH' is not a valid branch name."
          for protected in "$DEFAULT_BRANCH" main master; do
            [ "$BRANCH" = "$protected" ] && fail "'$BRANCH' is protected."
          done
          [[ "$BRANCH" =~ ^[0-9a-f]{7,40}$ ]] && fail "'$BRANCH' looks like a commit, not a branch."
          # It must be an existing branch of this repository — not a tag or commit.
          curl -fsS -o /dev/null -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/branches/$(jq -rn --arg b "$BRANCH" '$b|@uri')" || fail "'$BRANCH' is not an existing branch."
          echo "Writing to feature branch '$BRANCH'."

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulsern/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Render and review every diagram (Astra)
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          [[ -z "$ONLY" || "$ONLY" =~ ^[a-z0-9-]+$ ]] || { echo "::error::only must be a diagram id"; exit 1; }
          node ops/review-diagrams.mjs ${ONLY:+--only "$ONLY"}
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show the reports
        if: always()
        run: |
          for f in $(git ls-files --others --modified reports/diagram-review | grep '\.md$'); do cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; done

      - name: Commit the reports (always — every paid review is kept)
        id: save
        if: always()
        run: |
          git config user.name "pulsern-diagram-review"
          git config user.email "pulsern-diagram-review@users.noreply.github.com"
          # A run that failed early may not have written every path; add what exists.
          for p in reports/diagram-review/; do [ -e "$p" ] && git add -- "$p"; done
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -q -m "Astra diagram review (rc=${{ steps.review.outputs.rc }})"
          for attempt in 1 2 3; do
            git push -q origin "HEAD:$BRANCH" && { echo "Saved."; echo "pushed=true" >> "$GITHUB_OUTPUT"; echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; }
            git pull -q --rebase origin "$BRANCH" || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the reports."; exit 1

      # Pushes made with the workflow token do not trigger other workflows, so
      # the review this commit needs is requested explicitly — through the
      # trusted, range-verified dispatch (Astra, PR #133 review, finding 17).
      - name: Request CI and the Astra review of what was just pushed
        if: always() && steps.save.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ steps.save.outputs.head }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          # CI on the commit actually pushed — after any rebase — so the
          # publication guards (fresh map, current manifest, tests) run on the
          # final tree, not on the one the job started from (Astra, PR #134
          # review, round 5).
          jq -n --arg ref "$BRANCH" '{ref:$ref}' |
            api -X POST "https://api.github.com/repos/$REPO/actions/workflows/pulsern-ci.yml/dispatches" -d @- >/dev/null
          echo "Started pulsern-ci on $BRANCH ($HEAD_SHA)."
          pr=$(api "https://api.github.com/repos/$REPO/pulls?state=open&head=$OWNER:$BRANCH" | jq -r '.[0].number // empty')
          if [ -z "$pr" ]; then echo "No open PR for $BRANCH: its review will run when one is opened."; exit 0; fi
          jq -n --arg ref "$DEFAULT_BRANCH" --arg head "$HEAD_SHA" --arg pr "$pr" '{ref:$ref,inputs:{head:$head,pr:$pr}}' |
            api -X POST "https://api.github.com/repos/$REPO/actions/workflows/pulsern-astra-review.yml/dispatches" -d @- >/dev/null
          echo "Requested the Astra review of PR #$pr at $HEAD_SHA."
      - name: Verdict
        if: always()
        run: |
          [ "${{ steps.review.outputs.rc }}" = "0" ] || { echo "::error::At least one diagram failed Astra's review — see the reports."; exit 1; }
