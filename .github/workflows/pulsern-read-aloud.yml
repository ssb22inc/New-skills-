name: pulsern-read-aloud

# Voices the read-aloud passages students have asked for
# (pulsern/ops/read-aloud-worker.mjs). The app's server holds no OpenAI key:
# it checks each request against the bank and queues it in the private
# "read-aloud" bucket; this job synthesises each queued passage, transcribes
# it back, and saves the audio only if it passes the word-for-word check.
#
# Runs every 15 minutes, and also carries itself on: a run that stops at
# its per-run limit with work left starts the next run (GitHub allows a
# workflow to dispatch itself with its own token), so the bank keeps being
# voiced even when GitHub delays or drops a scheduled run. It stops chaining
# when the work is done or today's budget is spent. After a failed run it
# carries on (after a 10-minute pause) only if that run still got work done,
# so a brief storage blip does not stall the bank and an outage never loops.
#
# Runs the DEFAULT branch's code only, in the pulsern-paid environment
# (OPENAI_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY). Spend is bounded:
# only bank-checked passages are queued, the route caps new passages per
# student and app-wide each day, and each run voices at most READ_ALOUD_MAX.

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Most passages to voice in this run"
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: pulsern-read-aloud
  cancel-in-progress: false

jobs:
  voice:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # only to start the next run while work remains
    environment: pulsern-paid
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pulsern
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Voice and check queued passages
        id: voice
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          READ_ALOUD_MAX: ${{ inputs.max || '200' }}
        run: node ops/read-aloud-worker.mjs
      - name: Carry on while work remains
        # also after a failed run that still got work done (a brief blip),
        # after a pause; a run that got nothing done never chains
        if: always() && steps.voice.outputs.more == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER_FAILURE: ${{ steps.voice.outcome == 'failure' }}
        run: |
          if [ "$AFTER_FAILURE" = "true" ]; then sleep 600; fi
          gh workflow run pulsern-read-aloud.yml --ref main --repo "$GITHUB_REPOSITORY"
